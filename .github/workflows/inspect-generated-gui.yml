name: Inspect cetusproEQ generated GUI
on:
  push:
    branches: [ 'feature/cetusproeq-v0.5.13-hplp-spectrum-curve' ]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore v0.5.1 source (SHA256 verified)
        run: python ci-source/unpack.py
      - name: Apply v0.5.2 compact 3D UI patch
        run: python ci-source/patch_052.py
      - name: Apply verified v0.5.3 glass UI patch
        run: python ci-source/apply_053.py
      - name: Apply v0.5.4 brushed-metal GUI patch
        run: python ci-source/apply_054.py
      - name: Apply v0.5.5 subtle metal UI patch (SHA256 verified)
        run: python ci-source/apply_055.py
      - name: Apply v0.5.6 metallic controls, coloured curves and smoothed spectrum (GUI-only)
        run: python ci-source/apply_056.py
      - name: Apply v0.5.7 darker compact UI and dropdown shadows (GUI-only)
        run: python ci-source/apply_057.py
      - name: Repair child component coordinate scaling v0.5.8 (GUI-only)
        run: python ci-source/apply_058.py
      - name: Apply v0.5.9 user-supplied branding and compact UI (GUI-only)
        run: python ci-source/apply_059.py
      - name: Apply exact v0.5.10.1 GUI-only font/popup revision (SHA256 verified)
        run: python ci-source/apply_05101.py
      - name: Apply v0.5.11 graphite knobs, coloured indicators and branded header (GUI-only)
        run: python ci-source/apply_0511.py
      - name: Apply verified v0.5.12 GUI-only layout and switch patch
        run: python ci-source/apply_0512.py
      - name: Fix v0.5.12.1 Dynamic switch availability and header alignment (GUI only)
        run: python ci-source/apply_05121.py
      - name: Apply v0.5.12.2 GUI refinements (arrows, branding, bands, value spacing)
        run: python ci-source/apply_05122.py
      - name: Verify v0.5.12 source and original audio DSP
        run: python tests/verify_v0512.py
      - name: Validate version and immutable DSP
        run: python -c "from pathlib import Path; c=Path('CMakeLists.txt').read_text(); assert 'VERSION 0.5.12.2' in c, 'Incorrect version'; assert Path('Source/PluginEditor.cpp').stat().st_size > 50000; print('v0.5.12.2 source verified')"
      - name: Apply v0.5.13 filter and analyzer improvements
        run: python ci-source/apply_0513.py
      - name: Verify v0.5.13 and unchanged DSP
        run: python tests/verify_v0513.py
      - name: Inspect filter selection, response and spectrum in generated GUI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for path in ["Source/PluginEditor.cpp","Source/PluginEditor.h","Source/PluginProcessor.cpp"]:
              source=Path(path).read_text(encoding="utf8")
              print("=== FILE",path,"BYTES",len(source))
              for name in ["updateSpectrum","drawSpectrumAndCurve","comboBoxChanged","selectBand","updateSelectedBandControls","setBand","buttonClicked","getBandType","resetFlat","createLayout"]:
                  matches=list(re.finditer(r'(?m)^.{0,120}(?:CetusproEQAudioProcessor|CetusproEQAudioProcessorEditor)::'+name+r'\s*\(',source))
                  for m in matches:
                      end=source.find("\nvoid ",m.start()+3)
                      if end<0: end=min(len(source),m.start()+8500)
                      print(">>> METHOD",name,"AT",m.start())
                      print(source[m.start():min(end,m.start()+9800)])
              if "PluginEditor" in path:
                  for term in ["bandType.addListener","bandType.onChange","bandTypeAttachment","updateSpectrum","dbSpectrum","getMagnitudeForFrequency"]:
                      ix=source.find(term)
                      if ix>=0:print(">>> TOKEN",term,source[max(0,ix-500):ix+1200])
          PY
