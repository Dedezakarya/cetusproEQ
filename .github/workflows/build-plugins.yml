name: Build cetusproEQ v0.5.17 Dynamic Engine VST3 + AU

on:
  workflow_dispatch:
  push:
    branches: [ main, master, 'feature/cetusproeq-v0.4-proworkflow', 'feature/cetusproeq-v0.5.1-native-build', 'feature/cetusproeq-v0.5.3-compact-3d', 'feature/cetusproeq-v0.5.3-glass-ui-build', 'feature/cetusproeq-v0.5.4-brushed-metal', 'feature/cetusproeq-v0.5.5-soft-metal', 'feature/cetusproeq-v0.5.6-metal-spectrum-ui', 'feature/cetusproeq-v0.5.7-dark-compact-ui', 'feature/cetusproeq-v0.5.8-layout-fix', 'feature/cetusproeq-v0.5.9-compact-branding', 'feature/cetusproeq-v0.5.10.1-dropdown-font', 'feature/cetusproeq-v0.5.11-dark-knob-layout', 'feature/cetusproeq-v0.5.12-layout-pass1', 'feature/cetusproeq-v0.5.12.1-header-dynamics-fix', 'feature/cetusproeq-v0.5.12.2-ui-fixes', 'feature/cetusproeq-v0.5.13-hplp-spectrum-curve', 'feature/cetusproeq-v0.5.14-analyzer-calibration', 'feature/cetusproeq-v0.5.15-spectrum-fill-compact-buttons', 'feature/cetusproeq-v0.5.16-zero-latency-label', 'feature/cetusproeq-v0.5.17-dynamic-engine' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  windows-vst3:
    name: Windows x64 VST3
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore v0.5.1 source (SHA256 verified)
        run: python ci-source/unpack.py
      - name: Apply v0.5.2 compact 3D UI patch
        run: python ci-source/patch_052.py
      - name: Apply verified v0.5.3 glass UI patch
        run: python ci-source/apply_053.py
      - name: Apply v0.5.4 brushed-metal GUI patch
        run: python ci-source/apply_054.py
      - name: Apply v0.5.5 subtle metal UI patch (SHA256 verified)
        run: python ci-source/apply_055.py
      - name: Apply v0.5.6 metallic controls, coloured curves and smoothed spectrum (GUI-only)
        run: python ci-source/apply_056.py
      - name: Apply v0.5.7 darker compact UI and dropdown shadows (GUI-only)
        run: python ci-source/apply_057.py
      - name: Repair child component coordinate scaling v0.5.8 (GUI-only)
        run: python ci-source/apply_058.py
      - name: Apply v0.5.9 user-supplied branding and compact UI (GUI-only)
        run: python ci-source/apply_059.py
      - name: Apply exact v0.5.10.1 GUI-only font/popup revision (SHA256 verified)
        run: python ci-source/apply_05101.py
      - name: Apply v0.5.11 graphite knobs, coloured indicators and branded header (GUI-only)
        run: python ci-source/apply_0511.py
      - name: Capture exact v0.5.11 generated editor for compatibility check
        uses: actions/upload-artifact@v4
        with:
          name: pre0512-source-${{ runner.os }}
          path: |
            Source/PluginEditor.cpp
            Source/PluginEditor.h
            CMakeLists.txt
          retention-days: 1
      - name: Apply verified v0.5.12 GUI-only layout and switch patch
        run: python ci-source/apply_0512.py
      - name: Fix v0.5.12.1 Dynamic switch availability and header alignment (GUI only)
        run: python ci-source/apply_05121.py
      - name: Apply v0.5.12.2 GUI refinements (arrows, branding, bands, value spacing)
        run: python ci-source/apply_05122.py
      - name: Verify v0.5.12 source and original audio DSP
        run: python tests/verify_v0512.py
      - name: Apply v0.5.13 HP/LP Butterworth default and interpolated spectrum (GUI only)
        run: python ci-source/apply_0513.py
      - name: Verify v0.5.13 source, filter curve, and unchanged DSP
        run: python tests/verify_v0513.py
      - name: Apply calibrated analyzer v0.5.14 (GUI-only dBFS, Range Tilt Reference)
        run: python ci-source/apply_0514.py
      - name: Verify v0.5.14 analyzer and immutable DSP
        run: python tests/verify_v0514.py
      - name: Apply v0.5.15 filled spectrum and compact analyzer controls
        run: python ci-source/apply_0515.py
      - name: Verify v0.5.15 startup smoothing, GUI and untouched DSP
        run: python tests/verify_v0515.py
      - name: Apply v0.5.16 ZERO LATENCY label relocation (GUI only)
        run: python ci-source/apply_0516.py
      - name: Verify v0.5.16 label position and unchanged DSP
        run: python tests/verify_v0516.py
      - name: Apply v0.5.17 frequency selective Dynamic EQ DSP and per-band UI
        run: python ci-source/apply_0517.py
      - name: Verify v0.5.17 detector, ratio knee dynamics and unchanged old parameter IDs
        run: python tests/verify_v0517.py
      - name: Validate version and immutable DSP
        run: python -c "from pathlib import Path; c=Path('CMakeLists.txt').read_text(); assert 'VERSION 0.5.17' in c, 'Incorrect version'; assert Path('Source/PluginEditor.cpp').stat().st_size > 50000; print('v0.5.17 source verified')"
      - name: Tool versions
        shell: pwsh
        run: |
          cmake --version
          git --version
      - name: Configure (Visual Studio 2022)
        shell: pwsh
        run: cmake -S . -B build-win -G "Visual Studio 17 2022" -A x64
      - name: Compile v0.5.17 dynamic DSP and Standalone
        shell: pwsh
        run: cmake --build build-win --config Release --target cetusproEQ_VST3 cetusproEQ_Standalone --parallel 4
      - name: Verify Standalone starts and stays alive (Windows smoke test)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exes = @(Get-ChildItem build-win/cetusproEQ_artefacts -Recurse -File -Filter cetusproEQ.exe)
          if ($exes.Count -ne 1) { throw "Expected one standalone executable; got $($exes.Count)" }
          $exe = $exes[0].FullName
          Write-Host "Launching $exe"
          $app = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 8
            $app.Refresh()
            if ($app.HasExited) { throw "Standalone application exited unexpectedly with code $($app.ExitCode)" }
            Write-Host "Standalone process stayed alive for 8s"
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - name: Validate VST3 host loading and GUI with pluginval
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = @(Get-ChildItem build-win/cetusproEQ_artefacts -Recurse -Directory -Filter cetusproEQ.vst3)
          if ($bundle.Count -ne 1) { throw "VST3 bundle missing/ambiguous" }
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip" -OutFile pluginval_Windows.zip
          Expand-Archive -LiteralPath pluginval_Windows.zip -DestinationPath pluginval-test -Force
          $validator = @(Get-ChildItem pluginval-test -Recurse -File -Filter pluginval.exe | Select-Object -First 1)
          if ($validator.Count -ne 1) { throw "pluginval executable missing" }
          New-Item -ItemType Directory -Force -Path validation-logs | Out-Null
          # GUI-subsystem executables may not populate LASTEXITCODE when called with &.
          # Start-Process -Wait reliably returns the exit status after all host/editor tests.
          $argsList = @('--validate-in-process', '--strictness-level', '5',
                         '--output-dir', 'validation-logs', '--validate',
                         ('"' + $bundle[0].FullName + '"'))
          $valProcess = Start-Process -FilePath $validator[0].FullName -ArgumentList $argsList -NoNewWindow -Wait -PassThru
          Write-Host "pluginval exit code: $($valProcess.ExitCode)"
          if ($valProcess.ExitCode -ne 0) { throw "VST3 plugin host/editor validation failed: $($valProcess.ExitCode)" }
      - name: Upload pluginval diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cetusproEQ-v0.5.17-Windows-validation-logs
          path: validation-logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Package Windows VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $dirs = @(Get-ChildItem -Path build-win/cetusproEQ_artefacts -Recurse -Directory -Filter cetusproEQ.vst3)
          if ($dirs.Count -ne 1) { throw "Expected exactly 1 VST3 bundle, found $($dirs.Count)" }
          $bundle = $dirs[0].FullName
          if (-not @(Get-ChildItem -LiteralPath $bundle -Recurse -File -Filter *.vst3).Count) {
            throw "Built VST3 bundle has no .vst3 module: $bundle"
          }
          Compress-Archive -LiteralPath $bundle -DestinationPath dist/cetusproEQ-v0.5.17-Windows-x64-VST3.zip -CompressionLevel Optimal -Force
          Get-Item dist/*.zip | Select-Object Name,Length
      - name: Package Windows Standalone executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exes = @(Get-ChildItem build-win/cetusproEQ_artefacts -Recurse -File -Filter cetusproEQ.exe)
          if ($exes.Count -ne 1) { throw "Standalone executable missing" }
          Compress-Archive -LiteralPath $exes[0].FullName -DestinationPath dist/cetusproEQ-v0.5.17-Windows-x64-Standalone.zip -CompressionLevel Optimal -Force
      - name: Upload Windows Standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: cetusproEQ-v0.5.17-Windows-x64-Standalone
          path: dist/cetusproEQ-v0.5.17-Windows-x64-Standalone.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: cetusproEQ-v0.5.17-Windows-x64-VST3
          path: dist/cetusproEQ-v0.5.17-Windows-x64-VST3.zip
          if-no-files-found: error
          retention-days: 30

  macos-au-vst3:
    name: macOS Universal (Intel + Apple Silicon) AU/VST3
    runs-on: macos-15-intel
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore v0.5.1 source (SHA256 verified)
        run: python ci-source/unpack.py
      - name: Apply v0.5.2 compact 3D UI patch
        run: python ci-source/patch_052.py
      - name: Apply verified v0.5.3 glass UI patch
        run: python ci-source/apply_053.py
      - name: Apply v0.5.4 brushed-metal GUI patch
        run: python ci-source/apply_054.py
      - name: Apply v0.5.5 subtle metal UI patch (SHA256 verified)
        run: python ci-source/apply_055.py
      - name: Apply v0.5.6 metallic controls, coloured curves and smoothed spectrum (GUI-only)
        run: python ci-source/apply_056.py
      - name: Apply v0.5.7 darker compact UI and dropdown shadows (GUI-only)
        run: python ci-source/apply_057.py
      - name: Repair child component coordinate scaling v0.5.8 (GUI-only)
        run: python ci-source/apply_058.py
      - name: Apply v0.5.9 user-supplied branding and compact UI (GUI-only)
        run: python ci-source/apply_059.py
      - name: Apply exact v0.5.10.1 GUI-only font/popup revision (SHA256 verified)
        run: python ci-source/apply_05101.py
      - name: Apply v0.5.11 graphite knobs, coloured indicators and branded header (GUI-only)
        run: python ci-source/apply_0511.py
      - name: Capture exact v0.5.11 generated editor for compatibility check
        uses: actions/upload-artifact@v4
        with:
          name: pre0512-source-${{ runner.os }}
          path: |
            Source/PluginEditor.cpp
            Source/PluginEditor.h
            CMakeLists.txt
          retention-days: 1
      - name: Apply verified v0.5.12 GUI-only layout and switch patch
        run: python ci-source/apply_0512.py
      - name: Fix v0.5.12.1 Dynamic switch availability and header alignment (GUI only)
        run: python ci-source/apply_05121.py
      - name: Apply v0.5.12.2 GUI refinements (arrows, branding, bands, value spacing)
        run: python ci-source/apply_05122.py
      - name: Verify v0.5.12 source and original audio DSP
        run: python tests/verify_v0512.py
      - name: Apply v0.5.13 HP/LP Butterworth default and interpolated spectrum (GUI only)
        run: python ci-source/apply_0513.py
      - name: Verify v0.5.13 source, filter curve, and unchanged DSP
        run: python tests/verify_v0513.py
      - name: Apply calibrated analyzer v0.5.14 (GUI-only dBFS, Range Tilt Reference)
        run: python ci-source/apply_0514.py
      - name: Verify v0.5.14 analyzer and immutable DSP
        run: python tests/verify_v0514.py
      - name: Apply v0.5.15 filled spectrum and compact analyzer controls
        run: python ci-source/apply_0515.py
      - name: Verify v0.5.15 startup smoothing, GUI and untouched DSP
        run: python tests/verify_v0515.py
      - name: Apply v0.5.16 ZERO LATENCY label relocation (GUI only)
        run: python ci-source/apply_0516.py
      - name: Verify v0.5.16 label position and unchanged DSP
        run: python tests/verify_v0516.py
      - name: Apply v0.5.17 frequency selective Dynamic EQ DSP and per-band UI
        run: python ci-source/apply_0517.py
      - name: Verify v0.5.17 detector, ratio knee dynamics and unchanged old parameter IDs
        run: python tests/verify_v0517.py
      - name: Validate version and immutable DSP
        run: python -c "from pathlib import Path; c=Path('CMakeLists.txt').read_text(); assert 'VERSION 0.5.17' in c, 'Incorrect version'; assert Path('Source/PluginEditor.cpp').stat().st_size > 50000; print('v0.5.17 source verified')"
      - name: Tool versions
        run: |
          cmake --version
          xcodebuild -version
      - name: Configure universal macOS binaries
        run: |
          cmake -S . -B build-mac -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES='x86_64;arm64' \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
      - name: Compile VST3 and AU
        run: cmake --build build-mac --config Release --target cetusproEQ_VST3 cetusproEQ_AU --parallel 4
      - name: Find, inspect and package bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile_workaround() { :; }
          vst=$(find build-mac/cetusproEQ_artefacts -type d -name 'cetusproEQ.vst3' -print -quit)
          au=$(find build-mac/cetusproEQ_artefacts -type d -name 'cetusproEQ.component' -print -quit)
          test -n "$vst" && test -d "$vst" || { echo 'VST3 bundle missing'; exit 1; }
          test -n "$au" && test -d "$au" || { echo 'AU bundle missing'; exit 1; }
          test -f "$vst/Contents/MacOS/cetusproEQ" || { echo 'VST3 executable missing'; exit 1; }
          test -f "$au/Contents/MacOS/cetusproEQ" || { echo 'AU executable missing'; exit 1; }
          xcrun lipo -info "$vst/Contents/MacOS/cetusproEQ"
          xcrun lipo -info "$au/Contents/MacOS/cetusproEQ"         
          xcrun lipo "$vst/Contents/MacOS/cetusproEQ" -verify_arch x86_64
          xcrun lipo "$vst/Contents/MacOS/cetusproEQ" -verify_arch arm64
          xcrun lipo "$au/Contents/MacOS/cetusproEQ" -verify_arch x86_64
          xcrun lipo "$au/Contents/MacOS/cetusproEQ" -verify_arch arm64
          codesign --force --deep --sign - "$vst"
          codesign --force --deep --sign - "$au"
          ditto -c -k --sequesterRsrc --keepParent "$vst" dist/cetusproEQ-v0.5.17-macOS-Universal-VST3.zip
          ditto -c -k --sequesterRsrc --keepParent "$au" dist/cetusproEQ-v0.5.17-macOS-Universal-AU.zip
          ls -lh dist/*.zip
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cetusproEQ-v0.5.17-macOS-Universal-AU-and-VST3
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
